{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2>Edit Parent</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Save Changes</button>
        <a href="{% url 'students:parent_detail' parent.id %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
