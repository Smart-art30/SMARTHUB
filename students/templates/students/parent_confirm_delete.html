{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2>Delete Parent</h2>
    <p>Are you sure you want to delete <strong>{{ parent.user.first_name }} {{ parent.user.last_name }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'students:parent_detail' parent.id %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
