{% extends 'base.html' %}
{% block title %}Add Payment{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-4">Add Payment</h2>

    {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
    {% endfor %}

    <form method="POST" class="needs-validation" novalidate>
        {% csrf_token %}

        <!-- Class -->
        <div class="mb-3">
            <label for="student_class" class="form-label">Class</label>
            <select class="form-select" id="student_class" {% if preselected_invoice_id %}disabled{% endif %}>
                <option value="">Select Class</option>
                {% for cls in classes %}
                    {% if preselected_invoice_id %}
                        {% for inv in invoices %}
                            {% if inv.id|stringformat:"s" == preselected_invoice_id|stringformat:"s" %}
                                {% if inv.fee_structure.student_class.id == cls.id %}
                                    <option value="{{ cls.id }}" selected>{{ cls.name }}</option>
                                {% endif %}
                            {% endif %}
                        {% endfor %}
                    {% else %}
                        <option value="{{ cls.id }}">{{ cls.name }}</option>
                    {% endif %}
                {% endfor %}
            </select>
        </div>

        <!-- Student -->
        <div class="mb-3">
            <label for="student" class="form-label">Student</label>
            <select class="form-select" id="student" name="student" {% if preselected_invoice_id %}disabled{% endif %}>
                <option value="">Select Student</option>
                {% for s in students %}
                    {% if preselected_invoice_id %}
                        {% for inv in invoices %}
                            {% if inv.id|stringformat:"s" == preselected_invoice_id|stringformat:"s" %}
                                {% if inv.student.id == s.id %}
                                    <option value="{{ s.id }}" selected>{{ s.user.get_full_name }}</option>
                                {% endif %}
                            {% endif %}
                        {% endfor %}
                    {% else %}
                        <option value="{{ s.id }}">{{ s.user.get_full_name }}</option>
                    {% endif %}
                {% endfor %}
            </select>
        </div>

        <!-- Invoice -->
        <div class="mb-3">
            <label for="invoice" class="form-label">Invoice</label>
            <select class="form-select" id="invoice" name="invoice" required {% if preselected_invoice_id %}disabled{% endif %}>
                <option value="">Select Invoice</option>
                {% for inv in invoices %}
                    <option value="{{ inv.id }}"
                        {% if preselected_invoice_id and inv.id|stringformat:"s" == preselected_invoice_id|stringformat:"s" %}
                            selected
                        {% endif %}
                    >
                        {{ inv.fee_structure.student_class.name }} | {{ inv.fee_structure.term }} {{ inv.fee_structure.year }} | Total: {{ inv.total_amount }} | Paid: {{ inv.total_paid|default:"0" }} | Balance: {{ inv.balance|default:"0" }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <!-- Payment Details -->
        <div class="mb-3">
            <label for="amount" class="form-label">Amount</label>
            <input type="number" step="0.01" class="form-control" id="amount" name="amount" required>
        </div>

        <div class="mb-3">
            <label for="payment_method" class="form-label">Payment Method</label>
            <select class="form-select" id="payment_method" name="payment_method" required>
                <option value="">Select Method</option>
                <option value="cash">Cash</option>
                <option value="bank">Bank</option>
                <option value="mpesa">M-Pesa</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="settlement_account" class="form-label">Settlement Account</label>
            <select class="form-select" id="settlement_account" name="settlement_account" required>
                <option value="">Select Account</option>
                <option value="cash">Cash</option>
                <option value="bank">Bank</option>
                <option value="mpesa">M-Pesa</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="transaction_reference" class="form-label">Transaction Reference (optional)</label>
            <input type="text" class="form-control" id="transaction_reference" name="transaction_reference">
        </div>

        <button type="submit" class="btn btn-success">Record Payment</button>
        <a href="{% url 'finance:payment_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
