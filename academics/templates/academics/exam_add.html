{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h3 class="mb-4">➕ Add Exam</h3>
    
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}
    
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label fw-bold">Exam Name</label>
            <input type="text" name="name" class="form-control" 
                   value="{{ name|default:'' }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label fw-bold">Term</label>
            <input type="text" name="term" class="form-control" 
                   value="{{ term|default:'' }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label fw-bold">Year</label>
            <input type="number" name="year" class="form-control" min="2000" max="2030"
                   value="{{ year|default:'' }}" required>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-success">
                <i class="bi bi-plus-circle me-1"></i>Create Exam
            </button>
            <a href="{% url 'academics:exam_list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
